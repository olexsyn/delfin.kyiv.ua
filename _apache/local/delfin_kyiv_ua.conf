<IfModule mod_ssl.c>
    <VirtualHost 127.0.1.35:443>
        ServerName delfin.kyiv.ua.loc
        DocumentRoot /home/www/delfin.kyiv.ua/html

        # sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /home/www/delfin.kyiv.ua/__ssl/delfin.kyiv.ua.key -out /home/www/delfin.kyiv.ua/__ssl/delfin.kyiv.ua.pem
        # SSLCertificateFile     /home/www/delfin.kyiv.ua/__ssl/delfin.kyiv.ua.pem
        # SSLCertificateKeyFile  /home/www/delfin.kyiv.ua/__ssl/delfin.kyiv.ua.key
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        <FilesMatch "\.(py|html|htm|css|js)$">
            SSLOptions +StdEnvVars
        </FilesMatch>

        <Directory /home/www/delfin.kyiv.ua/html/>
            Options +Includes
            AddType text/html .htm
            DirectoryIndex idx.htm
            AddOutputFilter INCLUDES .htm
            AllowOverride All
            Require all granted
        </Directory>

        ScriptAlias /cgi-bin/ /home/www/delfin.kyiv.ua/cgi-bin/
        <Directory "/home/www/delfin.kyiv.ua/cgi-bin">
            AllowOverride None
            Options +ExecCGI -MultiViews
            Require all granted
            SSLOptions +StdEnvVars
        </Directory>

        ErrorLog /home/www/delfin.kyiv.ua/.logs/error.log
        CustomLog /home/www/delfin.kyiv.ua/.logs/access.log combined
        # ErrorLog ${APACHE_LOG_DIR}/delfin.kyiv.ua_error.log
        # CustomLog ${APACHE_LOG_DIR}/delfin.kyiv.ua_access.log combined

    </VirtualHost>
</IfModule>
