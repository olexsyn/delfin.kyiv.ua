<IfModule mod_ssl.c>
<VirtualHost *:443  [::]:443>
        ServerName delfin.kyiv.ua
        DocumentRoot /home/www/delfin.kyiv.ua/public_html

        <Directory /home/www/delfin.kyiv.ua/public_html/>
                Options -Indexes +Includes
                AddType text/html .htm
                DirectoryIndex idx.htm
                AddOutputFilter INCLUDES .htm
                AllowOverride All
                Require all granted
        </Directory>

        ScriptAlias /cgi-bin/ /home/www/delfin.kyiv.ua/cgi-bin/
        <Directory "/home/www/delfin.kyiv.ua/cgi-bin">
                AllowOverride None
                Options +ExecCGI -MultiViews
                Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/delfin.kyiv.ua_error.log
        CustomLog ${APACHE_LOG_DIR}/delfin.kyiv.ua_access.log combined

SSLCertificateFile /etc/letsencrypt/live/delfin.kyiv.ua/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/delfin.kyiv.ua/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:443  [::]:443>
    ServerName www.delfin.kyiv.ua
    Redirect permanent / http://delfin.kyiv.ua/


SSLCertificateFile /etc/letsencrypt/live/delfin.kyiv.ua/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/delfin.kyiv.ua/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
