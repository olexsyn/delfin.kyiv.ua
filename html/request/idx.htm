<!DOCTYPE html>
<html lang="uk">
	<head>
		<!--#set var="PAGE_ID" value="join"-->
		<!--#include virtual="/_parts/head.htm"-->
		<title>Заявка на пробний урок КДЮСШ «Дельфін»</title>
		<meta name="description" content="">
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="icon" sizes="16x16 32x32" href="/favicon.ico">
		<!--#set var="TX_CHILD" value="Прізвище, ім'я"-->
		<!--#set var="SE_YEAR" value="Рік народження"-->
	</head>

	<body>
		<!--#include virtual="/_parts/nav_top.htm"-->

		<div class="container">

			<div class="page-header">
				<h1>Заявка на пробний урок</h1>
			</div>

			<p class="fs-5">Зірочкою позначені <span class="text-danger">*</span> <b>обов'язкові для заповнення поля</b></p>

			<form action="request.py" method="POST" class="row g-3" onsubmit="return validateFormOnSubmit(this)">
				<fieldset>
					<p class="h4">Дані про дитину</p>

					<div class="row g-3 align-items-center">
						<label class="col-sm-3 col-form-label" for="id_child"><span class="text-danger">*</span> <!--#echo var='TX_CHILD' -->:</label>
						<div class="col-sm-9">
							<input type="text" class="form-control" id="id_child" name="tx_child" value="" placeholder="Прізвище Ім'я" />
						</div>
					</div>

					<div class="row g-3 align-items-center pt-2">
						<label class="col-sm-3 col-form-label"><span class="text-danger">*</span> Стать:</label>
						<div class="col-sm-4">
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_gender" value="W" id="ra_gender_w">
								<label class="form-check-label" for="ra_gender_w">дівчинка</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_gender" value="M" id="ra_gender_m">
								<label class="form-check-label" for="ra_gender_m">хлопчик</label>
							</div>
						</div>
						<label class="col-sm-2 col-form-label"><span class="text-danger">*</span> <!--#echo var='SE_YEAR' -->:</label>
						<div class="col-sm-3">
							<select class="form-select" name="se_year">
								<option value="0">вибрати</option>
								<option value="older">старше</option>
								<option value="2011">2011</option>
								<option value="2012">2012</option>
								<option value="2013">2013</option>
								<option value="2014">2014</option>
								<option value="2015">2015</option>
								<option value="2016">2016</option>
								<option value="2017">2017</option>
								<option value="2018">2018</option>
								<option value="2019">2019</option>
								<option value="2020">2020</option>
								<option value="younger">молодше</option>
							</select>
						</div>
					</div>

					<div class="row g-3 pt-2">
						<label class="col-sm-3 col-form-label">Навички плавання:</label>
						<div class="col-sm-9">
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_swim" value="rank" id="ra_swim_rank">
								<label class="form-check-label" for="ra_swim_rank">має спортивний розряд</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_swim" value="good" id="ra_swim_good">
								<label class="form-check-label" for="ra_swim_good">впевнено тримається на воді</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_swim" value="soso" id="ra_swim_soso">
								<label class="form-check-label" for="ra_swim_soso">може проплисти декілька метрів</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_swim" value="dnot" id="ra_swim_dnot">
								<label class="form-check-label" for="ra_swim_dnot">не вміє плавати</label>
							</div>
						</div>
					</div>

					<hr />
					<p class="h4">Зручний час для відвідування тренувань</p>

					<div class="row g-3">
						<label class="col-sm-3 col-form-label">&nbsp;</label>
						<div class="col-sm-9">
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_time" value="15" id="ra_time_15">
								<label class="form-check-label" for="ra_time_15">15:00 &ndash; 15:45</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="ra_time" value="18" id="ra_time_18">
								<label class="form-check-label" for="ra_time_18">18:00 &ndash; 18:45</label>
							</div>
						</div>
					</div>

					<hr />
					<p class="h4">Дані про батьків</p>
					<p class="text-muted">Після надсилання форми чекайте на дзвінок або email-повідомлення з описом наступних дій</p>

					<div class="row g-3 align-items-center">
						<label class="col-sm-3 col-form-label">Контакт 1:</label>
						<div class="col-sm-3">
							<select class="form-select" name="se_par1who">
								<option value="mama" selected>мама</option>
								<option value="tato">тато</option>
								<option value="baba">бабуся</option>
								<option value="dida">дідусь</option>
								<option value="brat">брат</option>
								<option value="sest">сестра</option>
								<option value="other">хтось інший</option>
							</select>
						</div>
						<div class="col-sm-6">
							<input type="text" class="form-control" name="tx_par1name" value="" placeholder="Ім'я, по батькові" />
						</div>
					</div>

					<div class="row g-3 align-items-center pt-2">
						<label class="col-sm-3 col-form-label" for="tx_par1mail"><span class="text-danger">*</span> E-mail:</label>
						<div class="col-sm-4">
							<input type="text" class="form-control" name="tx_par1mail" value="" placeholder="my1@mail.com" />
						</div>
						<label class="col-sm-2 col-form-label" for="tx_par1pho"><span class="text-danger">*</span> Телефон(и):</label>
						<div class="col-sm-3">
							<input type="tel" class="form-control" id="tx_par1pho" name="tx_par1pho" value="" placeholder="+38(0__) ___-__-__" />
						</div>
					</div>

					<hr class="my-4" />

					<div class="row g-3 align-items-center">
						<label class="col-sm-3 col-form-label">Контакт 2:</label>
						<div class="col-sm-3">
							<select class="form-select" name="se_par2who">
								<option value="mama">мама</option>
								<option value="tato" selected>тато</option>
								<option value="baba">бабуся</option>
								<option value="dida">дідусь</option>
								<option value="brat">брат</option>
								<option value="sest">сестра</option>
								<option value="other">хтось інший</option>
							</select>
						</div>
						<div class="col-sm-6">
							<input type="text" class="form-control" name="tx_par2name" value="" placeholder="Ім'я, по батькові" />
						</div>
					</div>

					<div class="row g-3 align-items-center pt-2">
						<label class="col-sm-3 col-form-label" for="tx_par2mail">E-mail:</label>
						<div class="col-sm-4">
							<input type="text" class="form-control" name="tx_par2mail" value="" placeholder="my2@mail.com" />
						</div>
						<label class="col-sm-2 col-form-label" for="tx_par2pho">Телефон(и):</label>
						<div class="col-sm-3">
							<input type="tel" class="form-control" id="tx_par2pho" name="tx_par2pho" value="" placeholder="+38(0__) ___-__-__" />
						</div>
					</div>

					<hr class="my-4" />

					<p class="h4">Додаткова інформація</p>

					<div class="row g-3">
						<label class="col-sm-3 col-form-label" for="ta_desc"><small>(не обов'язково)</small>:</label>
						<div class="col-sm-9">
							<textarea class="form-control" rows="3" name="ta_desc"></textarea>
						</div>
					</div>

					<hr class="my-4" />

					<div class="row g-3 align-items-center">
						<div class="col-sm-1 text-end"><span class="text-danger">*</span></div>
						<div class="col-sm-7">
							<select class="form-select" name="se_bot">
								<option value="0">Вкажіть, що Ви не бот</option>
								<option value="1">Я не зайчик</option>
								<option value="2">Я не песик</option>
								<option value="3">Я не лисичка</option>
								<option value="4">Я не рибка</option>
								<option value="5">Я не котик</option>
								<option value="6">Я не ведмедик</option>
								<option value="7">Я не ботик</option>
								<option value="8">Я не слоник</option>
								<option value="9">Я не коник</option>
							</select>
						</div>
						<div class="col-sm-4">
							<button type="submit" class="btn btn-success">Відправити заявку</button>
						</div>
					</div>

				</fieldset>
			</form>

		</div> <!-- /container -->

		<!--#include virtual="/_parts/footer.htm"-->

		<!--#include virtual="/_parts/js_loader.htm"-->

		<script src="https://cdn.jsdelivr.net/npm/imask@7/dist/imask.min.js"></script>

		<script>

			const color_ok    = "#fff";
			const color_error = "#ffdede";

			const par1phoInput = document.querySelector('#tx_par1pho');
			const par2phoInput = document.querySelector('#tx_par2pho');

			const par1phoMask = IMask(par1phoInput, { mask: '+{38}(000) 000-00-00' });
			const par2phoMask = IMask(par2phoInput, { mask: '+{38}(000) 000-00-00' });

			window.addEventListener('pageshow', () => {
				par1phoMask.updateValue();
				par2phoMask.updateValue();
			});

			function validateFormOnSubmit(theForm)
			{
				reason = "";
				add_mess = "";

				function addIfNew()
				{
					if (add_mess)
					{
						if (reason.indexOf(add_mess) == -1)
						{
							reason += add_mess;
							add_mess = "";
						}
					}
				}

				add_mess = validateEmpty      (theForm.tx_child, "<!--#echo var='TX_CHILD' -->"); addIfNew()
				add_mess = validateEmptySelect(theForm.se_year,  "<!--#echo var='SE_YEAR' -->");  addIfNew()
				add_mess = validateEmptyFields(theForm.tx_par1mail, theForm.tx_par2mail);         addIfNew()
				add_mess = validateEmail      (theForm.tx_par1mail);                              addIfNew()
				add_mess = validateEmail      (theForm.tx_par2mail);                              addIfNew()
				add_mess = validatePhoneFields(theForm.tx_par1pho, theForm.tx_par2pho, par1phoMask, par2phoMask); addIfNew()

				if (reason != "")
				{
					alert("Будь ласка, перевірте та виправте деякі поля:\n" + reason);
					return false;
				}

				return true;
			}


			function validateEmptyFields(fld1, fld2)
			{
				error_txt = "";

				if (fld1.value.length == 0 && fld2.value.length == 0)
				{
					fld1.style.background = color_error;
					fld2.style.background = color_error;
					error_txt = "Вкажіть хоча б одну адресу електронної пошти;\n"
				}
				else
				{
					fld1.style.background = color_ok;
					fld2.style.background = color_ok;
				}

				return error_txt;
			}


			function validatePhoneFields(fld1, fld2, mask1, mask2)
			{
				error_txt = "";

				if (!mask1.masked.isComplete && !mask2.masked.isComplete)
				{
					fld1.style.background = color_error;
					fld2.style.background = color_error;
					error_txt = "Вкажіть хоча б один номер телефону повністю;\n"
				}
				else
				{
					fld1.style.background = color_ok;
					fld2.style.background = color_ok;
				}

				return error_txt;
			}


			function validateEmpty(fld, addtxt)
			{
				error_txt = "";

				if (fld.value.length == 0)
				{
					fld.style.background = color_error;
					error_txt = addtxt + " - обов'язкове поле не заповнене;\n"
				}
				else
				{
					fld.style.background = color_ok;
				}

				return error_txt;
			}


			function validateEmptySelect(fld, addtxt)
			{
				error_txt = "";

				if (fld.value == 0)
				{
					fld.style.background = color_error;
					error_txt = addtxt + " - обов'язкове поле не заповнене;\n"
				}
				else
				{
					fld.style.background = color_ok;
				}

				return error_txt;
			}


			function trim(s)
			{
				return s.replace(/^\s+|\s+$/, '');
			}


			function validateEmail(fld)
			{
				error_txt = "";
				tfld = trim(fld.value);
				emailFilter = /^[^@]+@[^@.]+\.[^@]*\w\w$/ ;
				illegalChars= /[\(\)\<\>\,\;\:\\\"\[\]]/ ;

				if (fld.value != "")
				{
					if (!emailFilter.test(tfld))
					{
						fld.style.background = color_error;
						error_txt = fld + " - вкажіть правильну адресу електронної пошти;\n";
					}
					else if (fld.value.match(illegalChars))
					{
						fld.style.background = color_error;
						error_txt = fld + " - адреса електронної пошти містить неприпустимі символи;\n";
					}
					else
					{
						fld.style.background = color_ok;
					}
				}
				return error_txt;
			}
		</script>

	</body>
</html>
